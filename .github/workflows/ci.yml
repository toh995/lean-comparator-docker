name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: extractions/setup-just@v4

      # Build with build-push-action so Docker layers are stored in the GitHub
      # Actions cache (type=gha). Unchanged layers, like the Lean toolchain and
      # comparator builds, get reused on later runs, which makes CI much faster.
      # `load: true` puts the built image into the local Docker so tests can run it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lean-comparator-docker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: just test-ci
