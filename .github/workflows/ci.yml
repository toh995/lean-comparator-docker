name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: extractions/setup-just@v4

      # Build the docker image, reading and writing to the shared GitHub Actions
      # cache. This speeds up CI runs, since CI runs can just use the cache rather
      # than building the image from scratch.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lean-comparator-docker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: just test-ci
