name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Let every arch finish even if one fails, so we can tell whether a
      # breakage is arch-specific or affects all arches.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: extractions/setup-just@v4

      # Build the docker image, reading and writing to the shared GitHub Actions
      # cache. This speeds up CI runs, since CI runs can just use the cache rather
      # than building the image from scratch.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lean-comparator-docker
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - run: just test-ci
