name: Build and test

on:
  workflow_call:
    inputs:
      # Publish the tested images to ghcr as one multi-arch image.
      should_publish:
        type: boolean
        required: true

jobs:
  build-and-test:
    strategy:
      # Let every arch finish even if one fails, so we can tell whether a
      # breakage is arch-specific or affects all arches.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: extractions/setup-just@v4

      # Build the docker image, reading and writing to the shared GitHub Actions
      # cache. This speeds up CI runs, since CI runs can just use the cache rather
      # than building the image from scratch.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lean-comparator-docker
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - run: just test-ci

      # Push this arch's tested image under a per-arch tag. The `tag-multi-arch`
      # job then stitches every arch's tag into one multi-arch tag.
      - if: inputs.should_publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.should_publish
        run: |
          image_name="ghcr.io/${{ github.repository }}"
          tag="$image_name:sha-${GITHUB_SHA::7}-${{ matrix.arch }}"
          docker tag lean-comparator-docker "$tag"
          docker push "$tag"

  tag-multi-arch:
    if: inputs.should_publish
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image_name="ghcr.io/${{ github.repository }}"
          sha="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "$image_name:latest" \
            -t "$image_name:$sha" \
            "$image_name:$sha-amd64" \
            "$image_name:$sha-arm64"
